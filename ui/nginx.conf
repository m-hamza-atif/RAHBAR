# nginx for the ui Deployment. Replaces /etc/nginx/nginx.conf in your image.
#
# Built to run as a non-root user with readOnlyRootFilesystem: true (section 4.7).
# - It listens on 8080, because a non-root process cannot bind ports below 1024.
# - Everything nginx writes (pid, temp files) goes under /tmp, so mount an
#   emptyDir volume at /tmp in your Deployment.
# - Logs go to stdout and stderr (section 4.8).
#
# The API is NOT proxied here: your Ingress routes /api to the api Service.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # For the ui container's own probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The UI container is NOT the API. If Ingress temporarily routes API
        # or readiness requests here during route reconciliation, do not return index.html (200).
        location /api/ {
            access_log off;
            default_type application/json;
            return 503 "{\"status\":\"not_ready\",\"error\":\"api route reached ui container\"}\n";
        }

        location = /readyz {
            access_log off;
            default_type application/json;
            return 503 "{\"status\":\"not_ready\",\"error\":\"readyz reached ui container\"}\n";
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
